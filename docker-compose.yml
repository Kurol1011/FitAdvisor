version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: fitadvisor
      POSTGRES_PASSWORD: fitadvisor
      POSTGRES_DB: fitadvisor_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
















