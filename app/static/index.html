<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitAdvisor — demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:800px; margin:24px auto; padding:0 12px; }
    label { display:block; margin-top:10px; font-weight:600; }
    input, select, textarea { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; }
    button { margin-top:12px; padding:10px 18px; font-size:16px; }
    pre { background:#f6f6f6; padding:12px; overflow:auto; }
    .row { display:flex; gap:8px; }
    .col { flex:1; }
  </style>
</head>
<body>
  <h1>FitAdvisor — demo</h1>
  <p>Введите профиль — получите базовый план тренировок и питания на 4 недели.</p>

  <form id="profile">
    <label>Email<input name="email" type="email" required></label>

    <div class="row">
      <div class="col">
        <label>Возраст<input name="age" type="number" min="10" max="100" required></label>
      </div>
      <div class="col">
        <label>Пол
          <select name="gender">
            <option value="male">male</option>
            <option value="female">female</option>
          </select>
        </label>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Рост (см)<input name="height_cm" type="number" step="0.1" required></label>
      </div>
      <div class="col">
        <label>Вес (кг)<input name="weight_kg" type="number" step="0.1" required></label>
      </div>
    </div>

    <label>Уровень активности
      <select name="activity_level">
        <option value="sedentary">sedentary</option>
        <option value="light">light</option>
        <option value="moderate" selected>moderate</option>
        <option value="active">active</option>
        <option value="very_active">very_active</option>
      </select>
    </label>

    <label>Цель
      <select name="goal">
        <option value="lose_weight">Похудеть</option>
        <option value="gain_weight">Набрать массу</option>
        <option value="maintain">Поддержание</option>
      </select>
    </label>

    <label>Оборудование (comma separated, например: dumbbell,barbell,none)
      <input name="equipment" placeholder="none">
    </label>

    <label>Пищевые предпочтения / аллергии (json или текст)
      <textarea name="preferences" rows="2" placeholder='{"diet":"vegetarian","allergies":["nuts"]}'></textarea>
    </label>

    <button type="submit">Создать и получить план</button>
  </form>

  <h2>Результат</h2>
  <pre id="res">Здесь будет результат...</pre>

  <script>
    document.getElementById('profile').onsubmit = async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const payload = {
        email: form.get('email'),
        age: Number(form.get('age')),
        gender: form.get('gender'),
        height_cm: Number(form.get('height_cm')),
        weight_kg: Number(form.get('weight_kg')),
        activity_level: form.get('activity_level'),
        goals: { goal: form.get('goal') },
        preferences: (() => {
          try { return JSON.parse(form.get('preferences') || '{}'); } catch { return { raw: form.get('preferences') || '' } }
        })(),
        equipment: (form.get('equipment') || '').split(',').map(s => s.trim()).filter(Boolean)
      };
      document.getElementById('res').innerText = 'Запрос отправляется...';
      try {
        const r = await fetch('/api/v1/plans/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok) {
          document.getElementById('res').innerText = JSON.stringify(j, null, 2);
        } else {
          document.getElementById('res').innerText = JSON.stringify(j, null, 2);
        }
      } catch (err) {
        document.getElementById('res').innerText = 'Ошибка: ' + err.message;
      }
    };
  </script>
</body>
</html>
